name: kelas_mengaji_saderi
description: Aplikasi pengurusan kelas mengaji Al-Quran - Kelas Mengaji Saderi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # google_maps_flutter: ^2.18.0
  # google_maps_flutter_web: ^0.6.3
  # google_fonts: ^6.2.1        # untuk font custom seperti dalam design
  # intl: ^0.19.0               # untuk format tarikh/masa dengan lebih baik
  url_launcher: ^6.3.2        # untuk buka WhatsApp / Telefon / E-mel terus
  # table_calendar: ^3.1.2      # untuk kalendar penuh di halaman Jadual
  # shared_preferences: ^2.2.3  # untuk simpan data pendaftaran/tempatan

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/images/
